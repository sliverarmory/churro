name: Release Churro Go CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test Churro Go CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tested ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Test Go packages
        run: go test ./...
      - name: Smoke test CLI
        run: |
          go run ./cmd/churro-gen \
            -input testdata/windows-e2e/hello.js \
            -output "${{ runner.temp }}/hello.bin"
          test -s "${{ runner.temp }}/hello.bin"

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-amd64, goos: darwin, goarch: amd64, goarm: "" }
          - { target: darwin-arm64, goos: darwin, goarch: arm64, goarm: "" }
          - { target: freebsd-amd64, goos: freebsd, goarch: amd64, goarm: "" }
          - { target: freebsd-arm64, goos: freebsd, goarch: arm64, goarm: "" }
          - { target: linux-386, goos: linux, goarch: "386", goarm: "" }
          - { target: linux-amd64, goos: linux, goarch: amd64, goarm: "" }
          - { target: linux-armv7, goos: linux, goarch: arm, goarm: "7" }
          - { target: linux-arm64, goos: linux, goarch: arm64, goarm: "" }
          - { target: windows-386, goos: windows, goarch: "386", goarm: "" }
          - { target: windows-amd64, goos: windows, goarch: amd64, goarm: "" }
          - { target: windows-arm64, goos: windows, goarch: arm64, goarm: "" }
    steps:
      - name: Check out tested ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and package CLI
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ci-{0}', github.run_id) }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stem="churro-gen_${RELEASE_TAG}_${TARGET}"
          package_dir="release/${stem}"
          binary_name="churro-gen"
          archive_name="${stem}.tar.gz"
          if [[ "${GOOS}" == "windows" ]]; then
            binary_name="churro-gen.exe"
            archive_name="${stem}.zip"
          fi
          mkdir -p "${package_dir}/cmd/churro-gen" "${package_dir}/internal/loader"
          go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG}" \
            -o "${package_dir}/${binary_name}" ./cmd/churro-gen
          git rev-parse HEAD > "${package_dir}/SOURCE_COMMIT"
          cp LICENSE README.md ROADMAP.md "${package_dir}/"
          cp cmd/churro-gen/README.md "${package_dir}/cmd/churro-gen/"
          cp internal/loader/README.md "${package_dir}/internal/loader/"
          if [[ "${GOOS}" == "windows" ]]; then
            (cd release && zip -qr "${archive_name}" "${stem}")
          else
            tar -C release -czf "release/${archive_name}" "${stem}"
          fi
          (cd release && sha256sum "${archive_name}" > "${archive_name}.sha256")
          git rev-parse HEAD > "release/${archive_name}.commit"
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: churro-gen-${{ matrix.target }}
          path: |
            release/*.tar.gz
            release/*.zip
            release/*.sha256
            release/*.commit
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: churro-gen-*
          path: release
          merge-multiple: true
      - name: Validate tag and artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Release tag must be a version such as v1.2.3: ${RELEASE_TAG}" >&2
            exit 1
          fi
          tag_object=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object')
          [[ $(jq -r '.type' <<<"${tag_object}") == tag ]]
          tag_sha=$(jq -r '.sha' <<<"${tag_object}")
          tag_data=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}")
          [[ $(jq -r '.verification.verified' <<<"${tag_data}") == true ]]
          [[ $(jq -r '.object.type' <<<"${tag_data}") == commit ]]
          target_sha=$(jq -r '.object.sha' <<<"${tag_data}")
          [[ ${target_sha} =~ ^[0-9a-f]{40}$ ]]
          [[ $(find release -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l) -eq 11 ]]
          [[ $(find release -maxdepth 1 -type f -name '*.sha256' | wc -l) -eq 11 ]]
          [[ $(find release -maxdepth 1 -type f -name '*.commit' | wc -l) -eq 11 ]]
          (cd release && sha256sum --check ./*.sha256)
          for commit_file in release/*.commit; do
            [[ $(cat "${commit_file}") == "${target_sha}" ]]
          done
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; artifacts are immutable" >&2
            exit 1
          fi
      - name: Create checksums manifest
        shell: bash
        run: cat release/*.sha256 | sort -k 2 > release/checksums.txt
      - name: Create GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" release/* \
            --verify-tag --generate-notes --title "Churro ${RELEASE_TAG}"
